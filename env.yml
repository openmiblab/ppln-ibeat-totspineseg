# to first create conda env: conda env create -n ibeat-totspineseg -f env.yml
# to update conda env (prune flag removes unused packages): conda env update -n ibeat-totspineseg -f env.yml --prune
# delete environment: conda remove --name ibeat-totspineseg --all -y
# conda activate ibeat-totspineseg

# 1st run of yaml (discovery phase):
# Run YAML without specific versions.
# This allows conda-forge to solve for the most recent,
# compatible versions of all dependencies.

# subsequent runs of yaml (stability & freezing phase):
# conda list
# then manually add all version numbers to yaml, or create a new yaml:
# conda env export --no-builds > environment_frozen.yml

name: ibeat-totspineseg
channels:
  - pytorch
  - nvidia
  - conda-forge
  - nodefaults # blocks Anaconda's proprietary commercial defaults channel, keeps pipeline purely OSS

dependencies:
  - python=3.10
  - pytorch::pytorch
  - pytorch::torchvision
  - pytorch::pytorch-cuda=12.4
  - numpy
  - numexpr # compiler breaks on hpc without this
  - connected-components-3d # compiler breaks on hpc without this
  - ndindex # compiler breaks on hpc without this
  - pydantic<2.13 # FORCED: Stops 2.13 ClassAttribute removal crash
  - pandas
  - nibabel
  - seaborn
  - napari
  - pyside2 # equivalent to the napari[all] extra's default backend
  # pyside2 preferred over pyqt to keep environment cleaner
  # and avoid potential licensing issues
  - libblas=*=*mkl  # forces consistent MKL/OpenMP usage
  - pip

  - pip:
    - --extra-index-url https://pytorch.org # guides Pip to the CUDA wheel repo
    - -e . # install pipeline from source (.toml file)